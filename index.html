<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>人物相関図</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kurenaido&display=swap">
<style>
:root{--paper:#f5f8f1;--grid:#cddbc9;--ink:#23252a;--card:#fff;--hl:#ffe45c;--rc:#2f6fc4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--paper:#22271f;--grid:#333c30;--ink:#ece9df;--card:#2e352b;--hl:#7d7218}}
:root[data-theme=dark]{--paper:#22271f;--grid:#333c30;--ink:#ece9df;--card:#2e352b;--hl:#7d7218}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);font-family:'Zen Kurenaido','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#st{position:fixed;inset:0;touch-action:none;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
#w{position:absolute;left:0;top:0;transform-origin:0 0}
#ln{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible}
#ln text{font-size:14px;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--paper);stroke-width:6px;pointer-events:all}
.n{position:absolute;transform:translate(-50%,-50%) rotate(var(--r));padding:7px 13px;background:var(--card);border:2px solid var(--ink);border-radius:2px 4px 2px 5px;font-size:18px;line-height:1.2;white-space:nowrap}
.n.c{font-size:22px;border-width:3px;background:var(--hl)}
.n.sel{outline:3px solid var(--rc);outline-offset:3px}
#bar{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 8px;background:var(--paper);border-bottom:2px solid var(--ink);font-size:14px;line-height:1.4}
#bar{display:flex;gap:8px;align-items:center}
#hint{flex:1}
#ctl{display:flex;gap:6px}
#ctl button{flex:none;padding:4px 8px;font-size:13px}
#bot{position:fixed;left:0;right:0;bottom:0;padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 8px);background:var(--paper);border-top:2px solid var(--ink)}
#tabs,#rels{display:flex;gap:6px}
#rels{margin-bottom:8px;overflow-x:auto}
button{flex:1;font:inherit;font-size:15px;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:2px 4px 2px 5px;padding:9px 4px;white-space:nowrap}
button.on{background:var(--hl)}
#rels button{flex:none;padding:6px 10px;border-bottom-width:6px;font-size:14px}
#dlg{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 74px);z-index:5;display:flex;gap:6px;padding:8px;background:var(--paper);border:2px solid var(--ink)}
#dlg button{flex:none;padding:6px 10px}
#nm{flex:1;min-width:0;font:inherit;font-size:16px;padding:6px;border:2px solid var(--ink);background:var(--card);color:var(--ink);-webkit-user-select:text;user-select:text}
</style>
</head>
<body>
<div id="st"><div id="w"><svg id="ln"></svg></div></div>
<div id="bar"><span id="hint"></span><span id="ctl" hidden><button id="hold">ホールド</button><button id="rev">逆向き</button></span></div>
<div id="dlg" hidden><input id="nm" maxlength="12" placeholder="名前"><button id="ok">決定</button><button id="ca">やめる</button></div>
<div id="bot"><div id="rels" hidden></div><div id="tabs"></div></div>
<script>
const $=i=>document.getElementById(i);
const REL=[['friend','友達','#2f6fc4','',3.5],['best','親友','#14946b','',6],['crush','片思い','#e07a1f','9 7',3.5],['love','恋人','#d6336c','',4.5],['family','家族','#7d52b8','2 7',4],['hate','嫌い','#808080','9 5 2 5',3.5]];
const MODES=[['block','ブロック'],['rel','関係線'],['move','移動'],['focus','人物選択'],['del','消す']];
const HINT={block:'空いている所をタップして人を追加。人をタップすると名前を変えられます',move:'人をドラッグで移動。線の名前をドラッグで線の位置を調整（タップで元に戻す）。背景ドラッグで画面移動',focus:'人をタップでその人が中心に。同じ人をもう一度タップで解除。「関係線」に切り替えても中心のまま線を結べます',del:'消したい人、または線の名前をタップ。追加した関係は下の一覧をタップで削除'};
const S={nodes:[],edges:[],nid:1,mode:'block',rel:'friend',sel:null,hold:false,rev:false,focus:null,T:null,saved:null,tx:innerWidth/2,ty:innerHeight/2,k:1};
const els={},pos={},W=$('w'),LN=$('ln'),st=$('st'),KEY='soukanzu-v1';
const defs=()=>'<defs>'+REL.map(r=>`<marker id="m-${r[0]}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="${r[2]}" stroke-width="1.8" stroke-linecap="round"/></marker>`).join('')+'</defs>';
try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d){S.nodes=d.n;S.edges=d.e;S.nid=d.i;(d.c||[]).forEach(r=>REL.push(r))}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({n:S.nodes,e:S.edges,i:S.nid,c:REL.filter(r=>r[5])}))}catch(e){}}

function clip(p,el,c){const vx=c.x-p.x,vy=c.y-p.y,hw=el.offsetWidth/2+3,hh=el.offsetHeight/2+3;
  const t=Math.min(1,vx?hw/Math.abs(vx):9e9,vy?hh/Math.abs(vy):9e9);return{x:p.x+vx*t,y:p.y+vy*t}}

function hintText(){
  if(S.mode!='rel')return HINT[S.mode];
  const r=REL.find(r=>r[0]==S.rel)[1],n=S.sel!=null&&S.nodes.find(n=>n.id==S.sel);
  return n?(S.rev?`${n.name}を「${r}」と思っている人をタップ`:`${n.name}が「${r}」と思う相手をタップ`)+(S.hold?'（ホールド中）':''):`「${r}」と思っている人 → 思われている人の順に2人をタップ`}

function draw(){
  const f=S.focus;
  W.style.transform=`translate(${S.tx}px,${S.ty}px) scale(${S.k})`;
  st.style.backgroundPosition=`${S.tx}px ${S.ty}px`;
  st.style.backgroundSize=`${24*S.k}px ${24*S.k}px`;
  $('hint').textContent=hintText();
  $('ctl').hidden=S.mode!='rel';
  $('rev').hidden=S.mode!='rel';
  $('hold').textContent=S.mode=='focus'?'この人をホールド':'ホールド';
  $('hold').classList.toggle('on',S.mode=='rel'&&S.hold);
  $('rev').classList.toggle('on',S.rev);
  S.nodes.forEach(n=>{
    let el=els[n.id];
    if(!el){el=els[n.id]=document.createElement('div');el.dataset.id=n.id;el.style.setProperty('--r',((n.id*7)%5-2)*.7+'deg');W.appendChild(el)}
    const show=f==null||S.T[n.id];el.hidden=!show;if(!show)return;
    if(el.textContent!==n.name)el.textContent=n.name;
    el.className='n'+(n.id==S.sel?' sel':'')+(n.id==f?' c':'');
    el.style.opacity=f!=null&&S.T[n.id].d?.5:1;
    el.style.left=pos[n.id].x+'px';el.style.top=pos[n.id].y+'px';
  });
  const by=Object.fromEntries(S.nodes.map(n=>[n.id,n]));
  let h=defs();
  S.edges.forEach((e,i)=>{
    const A=by[e.a],B=by[e.b];if(!A||!B||els[A.id].hidden||els[B.id].hidden)return;
    const j=S.edges.findIndex(q=>q.a==e.b&&q.b==e.a&&q.t==e.t);if(j>=0&&j<i)return;
    const r=REL.find(r=>r[0]==e.t),a=pos[A.id],b=pos[B.id],dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,k=e.v??(j>=0?0:36),w=e.u||0;
    const c={x:(a.x+b.x)/2+dy/L*k+dx/L*w,y:(a.y+b.y)/2-dx/L*k+dy/L*w};
    const s=clip(a,els[A.id],c),t=clip(b,els[B.id],c),m={x:(s.x+2*c.x+t.x)/4,y:(s.y+2*c.y+t.y)/4};
    const o=f==null||e.a==f||e.b==f?1:.4;
    h+=`<g opacity="${o}"><path d="M${s.x} ${s.y}Q${c.x} ${c.y} ${t.x} ${t.y}" fill="none" stroke="${r[2]}" stroke-width="${r[4]}" stroke-dasharray="${r[3]}" stroke-linecap="round" marker-end="url(#m-${r[0]})"${j>=0?` marker-start="url(#m-${r[0]})"`:''}/><text data-e="${i}"${j>=0?` data-r="${j}"`:''} x="${m.x}" y="${m.y}" fill="${r[2]}">${r[1]}</text></g>`;
  });
  LN.innerHTML=h;
}

function go(){
  let mv=false;
  S.nodes.forEach(n=>{
    const t=S.focus!=null?S.T[n.id]:n;if(!t)return;
    const p=pos[n.id]||(pos[n.id]={x:t.x,y:t.y}),dx=t.x-p.x,dy=t.y-p.y;
    if(Math.abs(dx)+Math.abs(dy)>.5){p.x+=dx*.25;p.y+=dy*.25;mv=true}else{p.x=t.x;p.y=t.y}
  });
  draw();if(mv)requestAnimationFrame(go);
}

function layout(c,all){
  const adj={};S.edges.forEach(e=>{(adj[e.a]=adj[e.a]||new Set).add(e.b);(adj[e.b]=adj[e.b]||new Set).add(e.a)});
  const T={[c]:{x:0,y:0}},l1=[...(adj[c]||[])],R1=Math.max(150,l1.length*34),R2=R1+150;
  l1.forEach((id,i)=>{const a=-Math.PI/2+2*Math.PI*i/l1.length;T[id]={x:Math.cos(a)*R1,y:Math.sin(a)*R1,a}});
  l1.forEach(p=>{const ch=[...(adj[p]||[])].filter(q=>!T[q]);
    ch.forEach((q,j)=>{const a=T[p].a+(j-(ch.length-1)/2)*.5;T[q]={x:Math.cos(a)*R2,y:Math.sin(a)*R2}})});
  if(all){const o=S.nodes.filter(n=>!T[n.id]),R3=R2+130;o.forEach((n,i)=>{const a=-Math.PI/2+2*Math.PI*(i+.5)/o.length;T[n.id]={x:Math.cos(a)*R3,y:Math.sin(a)*R3,d:1}})}
  return T}

function setFocus(id){
  if(S.focus==null)S.saved={tx:S.tx,ty:S.ty,k:S.k};
  S.focus=id;S.T=layout(id,S.mode=='rel');
  const R=Math.max(1,...Object.values(S.T).map(p=>Math.hypot(p.x,p.y)));
  S.k=Math.max(.5,Math.min(1,(Math.min(innerWidth,innerHeight)/2-60)/R));
  S.tx=innerWidth/2;S.ty=70+(innerHeight-190)/2;
}

function clearFocus(){S.focus=null;if(S.saved){Object.assign(S,S.saved);S.saved=null}}

function setMode(m){
  S.mode=m;S.sel=null;S.hold=false;S.rev=false;
  if(S.focus!=null){if(m=='rel'){S.sel=S.focus;S.hold=true;setFocus(S.focus)}else if(m=='focus')setFocus(S.focus);else clearFocus()}
  [...$('tabs').children].forEach(b=>b.classList.toggle('on',b.dataset.m==m));
  $('rels').hidden=m!='rel'&&m!='del';buildRels();go();
}

let cb=null;
function ask(init,f,ph){cb=f;$('nm').value=init||'';$('nm').placeholder=ph||'名前';$('dlg').hidden=false;$('nm').focus()}
$('ok').onclick=()=>{const v=$('nm').value.trim();$('dlg').hidden=true;if(v&&cb)cb(v);cb=null};
$('ca').onclick=()=>{$('dlg').hidden=true;cb=null};
$('nm').onkeydown=e=>{if(e.key=='Enter'&&!e.isComposing)$('ok').onclick()};
$('hold').onclick=()=>{
  
  S.hold=!S.hold;draw()};
$('rev').onclick=()=>{S.rev=!S.rev;draw()};

function tap(x,y,el,lab){
  if(!$('dlg').hidden){$('ca').onclick();return}
  const n=el&&S.nodes.find(q=>q.id==el.dataset.id),m=S.mode;
  if(m=='del'){
    if(n){S.nodes=S.nodes.filter(q=>q!==n);S.edges=S.edges.filter(e=>e.a!=n.id&&e.b!=n.id);els[n.id].remove();delete els[n.id];delete pos[n.id]}
    else if(lab){const d=new Set([+lab.dataset.e,+(lab.dataset.r??-1)]);S.edges=S.edges.filter((_,i)=>!d.has(i))}
  }else if(m=='block'){
    if(n)ask(n.name,v=>{n.name=v;go();save()});
    else{const wx=(x-S.tx)/S.k,wy=(y-S.ty)/S.k;ask('',v=>{S.nodes.push({id:S.nid++,name:v,x:wx,y:wy});go();save()})}
  }else if(m=='rel'){
    if(!n)S.sel=null;
    else if(S.sel==null)S.sel=n.id;
    else if(S.sel==n.id)S.sel=null;
    else{
      const [x,y]=S.rev?[n.id,S.sel]:[S.sel,n.id],i=S.edges.findIndex(e=>e.a==x&&e.b==y);
      if(i<0)S.edges.push({a:x,b:y,t:S.rel});
      else if(S.edges[i].t==S.rel)S.edges.splice(i,1);
      else S.edges[i].t=S.rel;
      if(!S.hold)S.sel=null;
    }
  }else if(m=='focus'&&n){if(n.id==S.focus)clearFocus();else setFocus(n.id)}
  else if(m=='move'&&lab){const g=S.edges[+lab.dataset.e];delete g.u;delete g.v}
  if(S.focus!=null&&m=='rel')S.T=layout(S.focus,true);
  go();save();
}

const P2=new Map();let drag=null,pin=null;
st.onpointerdown=e=>{
  try{st.setPointerCapture(e.pointerId)}catch(_){}
  P2.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(P2.size>1){drag=null;pin=null;return}
  const el=e.target.closest('.n');
  drag={x:e.clientX,y:e.clientY,tx:S.tx,ty:S.ty,el,lab:e.target.closest('[data-e]'),moved:false};
  if(S.mode=='move'&&el){const n=S.nodes.find(q=>q.id==el.dataset.id);drag.node=n;drag.nx=n.x;drag.ny=n.y}
  else if(S.mode=='move'&&drag.lab){drag.edge=+drag.lab.dataset.e;drag.gx=(e.clientX-S.tx)/S.k-(+drag.lab.getAttribute('x'));drag.gy=(e.clientY-S.ty)/S.k-(+drag.lab.getAttribute('y'))}
};
st.onpointermove=e=>{
  if(!P2.has(e.pointerId))return;
  P2.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(P2.size==2){
    const [a,b]=[...P2.values()],d=Math.hypot(a.x-b.x,a.y-b.y)||1,m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    if(pin){const wx=(pin.m.x-S.tx)/S.k,wy=(pin.m.y-S.ty)/S.k;S.k=Math.min(2.5,Math.max(.3,S.k*d/pin.d));S.tx=m.x-wx*S.k;S.ty=m.y-wy*S.k;draw()}
    pin={d,m};return;
  }
  if(!drag)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.moved&&Math.hypot(dx,dy)<6)return;
  drag.moved=true;
  if(drag.node){const n=drag.node;n.x=drag.nx+dx/S.k;n.y=drag.ny+dy/S.k;pos[n.id]={x:n.x,y:n.y};go()}
  else if(drag.edge!=null){
    const g=S.edges[drag.edge],a=pos[g.a],b=pos[g.b],ex=b.x-a.x,ey=b.y-a.y,L=Math.hypot(ex,ey)||1;
    const px=(e.clientX-S.tx)/S.k-drag.gx-(a.x+b.x)/2,py=(e.clientY-S.ty)/S.k-drag.gy-(a.y+b.y)/2;
    g.u=2*(px*ex+py*ey)/L;g.v=2*(px*ey-py*ex)/L;draw()}
  else{S.tx=drag.tx+dx;S.ty=drag.ty+dy;draw()}
};
st.onpointerup=st.onpointercancel=e=>{
  P2.delete(e.pointerId);if(P2.size<2)pin=null;
  if(drag){
    if(!drag.moved&&e.type=='pointerup')tap(e.clientX,e.clientY,drag.el,drag.lab);
    else if(drag.node||drag.edge!=null)save();
  }
  drag=null;
};
st.addEventListener('wheel',e=>{
  e.preventDefault();
  const k=Math.min(2.5,Math.max(.3,S.k*(e.deltaY<0?1.1:.91))),q=k/S.k;
  S.tx=e.clientX-(e.clientX-S.tx)*q;S.ty=e.clientY-(e.clientY-S.ty)*q;S.k=k;draw();
},{passive:false});

MODES.forEach(([m,l])=>{const b=document.createElement('button');b.textContent=l;b.dataset.m=m;b.onclick=()=>setMode(m);$('tabs').appendChild(b)});
const PAL=['#b08900','#0e8fa8','#a8325e','#5b7f1e','#b5541c','#3d4fb8'];
function buildRels(){
  const box=$('rels'),del=S.mode=='del';box.textContent='';
  document.documentElement.style.setProperty('--rc',(REL.find(r=>r[0]==S.rel)||REL[0])[2]);
  REL.forEach(r=>{
    const b=document.createElement('button');b.textContent=r[1];b.style.borderBottomColor=r[2];
    b.classList.toggle('on',r[0]==S.rel&&!del);
    b.onclick=()=>{
      if(del){if(!r[5])return;REL.splice(REL.indexOf(r),1);S.edges=S.edges.filter(e=>e.t!=r[0]);if(S.rel==r[0])S.rel='friend';buildRels();go();save();return}
      S.rel=r[0];S.sel=null;buildRels();draw()};
    box.appendChild(b)});
  const p=document.createElement('button');p.textContent='＋追加';p.hidden=del;
  p.onclick=()=>ask('',v=>{v=v.replace(/[<>&"']/g,'');if(!v)return;const id='c'+Date.now();REL.push([id,v,PAL[REL.length%PAL.length],'',4,1]);S.rel=id;S.sel=null;buildRels();draw();save()},'関係の名前（例：先輩）');
  box.appendChild(p)}
setMode('block');
</script>
</body>
</html>
